<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs";
  // Kramdown renders ```mermaid blocks as <pre><code class="language-mermaid">.
  // Swap them for <div class="mermaid"> so Mermaid draws them.
  document.querySelectorAll("pre > code.language-mermaid, div.language-mermaid pre code").forEach((code) => {
    const div = document.createElement("div");
    div.className = "mermaid";
    div.textContent = code.textContent;
    const block = code.closest("div.language-mermaid") || code.parentElement;
    block.replaceWith(div);
  });
  const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict" });
  await mermaid.run({ querySelector: ".mermaid" });
</script>
